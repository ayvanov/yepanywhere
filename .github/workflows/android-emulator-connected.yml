name: Android Emulator Connected

on:
  pull_request:
    paths:
      - "packages/android-app/**"
      - "scripts/run-android-connected-tests.ps1"
      - ".github/workflows/android-emulator-connected.yml"
  workflow_dispatch:

jobs:
  android-emulator-connected:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/android-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit + Connected Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          profile: pixel_7
          arch: x86_64
          script: |
            ./gradlew :app:testDebugUnitTest :android-data:testDebugUnitTest
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.yepanywhere.android.RelayLoginScreenTest
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.yepanywhere.android.AndroidNotificationRouteIntentTest
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.yepanywhere.android.AndroidAppContainerPushEventTest
